version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: amex_concierge_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amex_concierge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amex_concierge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: amex_concierge_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amex_concierge_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=amex_concierge
      - REDIS_URL=redis://redis:6379/0
      - AMADEUS_API_KEY=mock_amadeus_key
      - AMADEUS_API_SECRET=mock_amadeus_secret
      - TWILIO_ACCOUNT_SID=mock_twilio_sid
      - TWILIO_AUTH_TOKEN=mock_twilio_token
      - TWILIO_PHONE_NUMBER=+1234567890
      - JWT_SECRET=super_secret_jwt_signing_key_change_me_in_production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
